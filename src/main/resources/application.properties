# ===== Application =====
spring.application.name=blog-platform
server.port=${PORT:8080}

# ===== Database (H2 - default, zero setup, resets on restart) =====
spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT =====
app.jwt.secret=ThisIsASecretKeyForJWTSigningChangeItInProductionMakeSureItsLong
app.jwt.expiration-ms=86400000

# ===== To switch to MySQL for production, comment out the H2 block above
# and uncomment below (create a database named 'blogdb' first):
# spring.datasource.url=jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
