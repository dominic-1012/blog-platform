<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Thiranex Blog</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container" style="max-width:420px;">
  <form onsubmit="handleRegister(event)">
    <h1>Create Account</h1>
    <div id="error" class="error"></div>
    <input id="username" type="text" placeholder="Username" required minlength="3">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (min 6 characters)" required minlength="6">
    <button class="primary" type="submit">Register</button>
    <div class="form-link">Already have an account? <a href="login.html">Login</a></div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>renderNav();</script>
</body>
</html>
